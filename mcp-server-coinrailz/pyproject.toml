[project]
name = "mcp-server-coinrailz"
version = "1.0.0"
description = "MCP server for Coin Railz x402 micropayment services"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Coin Railz", email = "support@coinrailz.com"}
]
keywords = ["mcp", "claude", "anthropic", "crypto", "blockchain", "x402", "payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://coinrailz.com"
Documentation = "https://coinrailz.com/developers"
Repository = "https://github.com/coinrailz/mcp-server-coinrailz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
