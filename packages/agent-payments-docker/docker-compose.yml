version: '3.8'

services:
  payments:
    build: .
    image: tdnupe3/agent-payments:latest
    container_name: coinrailz-payments
    ports:
      - "3000:3000"
    environment:
      - COINRAILZ_API_KEY=${COINRAILZ_API_KEY}
      - COINRAILZ_BASE_URL=${COINRAILZ_BASE_URL:-https://coinrailz.com}
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
