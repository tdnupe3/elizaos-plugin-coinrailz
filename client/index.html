<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Railz - AI-Powered Fintech Platform</title>
    <meta name="description" content="Revolutionary P2P payments, crypto exchange, and AI agent marketplace" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      /* Loading fallback styles */
      body { margin: 0; font-family: system-ui, sans-serif; }
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
      }
      .loading-content h1 { margin: 0 0 1rem 0; font-size: 2rem; }
      .loading-content p { margin: 0; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback content while JavaScript loads -->
      <div class="loading-fallback">
        <div class="loading-content">
          <h1>Coin Railz Platform</h1>
          <p>Loading AI-Powered Fintech Platform...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
